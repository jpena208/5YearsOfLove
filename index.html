<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our Story — Five Years of Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="book is-closed" id="book" aria-label="Our Story scrapbook">
      <!-- Inside pages are generated by script.js from the PAGES list -->
      <div class="pages" id="pages" aria-live="polite"></div>
      <div class="tap tap-left" id="tapLeft" aria-hidden="true"></div>
      <div class="tap tap-right" id="tapRight" aria-hidden="true"></div>

      <!-- Cover -->
      <section class="cover" id="cover">
        <div class="spine"></div>
        <div class="cover-face">
          <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
          <div class="cover-label">
            <h1>OUR STORY</h1>
            <p class="sub">Five Years of Us</p>
            <p class="years">2021 — 2026</p>
            <div class="rule"><svg class="deco tulip" viewBox="0 0 30 48" aria-hidden="true"><path d="M15 46V22" stroke="#6f8b6a" stroke-width="2.2"/><path d="M15 38c-6-2-9-5-10-9M15 34c5-2 8-4 9-8" stroke="#6f8b6a" stroke-width="2" fill="none"/><path d="M6 8c0 10 3 17 9 17s9-7 9-17l-5 5-4-7-4 7z" fill="#8e63a8"/></svg></div>
            <p class="names">Joey ♡ Ronalyn</p>
          </div>
          <span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✧</span>
        </div>
      </section>
    </div>

    <button class="open-btn" id="openBtn" type="button">Open Our Story</button>

    <nav class="controls" id="controls" hidden>
      <button type="button" id="prevBtn" aria-label="Previous page">‹</button>
      <span class="indicator" id="indicator">01 / 01</span>
      <button type="button" id="nextBtn" aria-label="Next page">›</button>
      <button type="button" id="chaptersBtn" class="text-btn">Chapters</button>
      <button type="button" id="closeBtn" class="text-btn">Back to cover</button>
      <div class="chapter-menu" id="chapterMenu" hidden></div>
    </nav>
  </main>

  <div class="vmodal" id="videoModal" hidden role="dialog" aria-label="Video">
    <div class="vframe"><button type="button" id="videoClose" aria-label="Close video">✕</button><div id="videoBox"></div></div>
  </div>

  <!-- Optional music: disabled by default. See README ("Optional music"). -->
  <script src="script.js"></script>
</body>
</html>
